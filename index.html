<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- iOS home screen. Apple masks the icon itself, so the PNG is full-bleed
         with no corner radius of its own. -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="description" content="Wander — plan trips together with your friends. Polls, itinerary, budget, packing and more in one beautiful place." />
    <title>Wander — Trip Planner</title>

    <!--
      Link preview card, for the moment an invite gets pasted into a group chat.

      ABSOLUTE URLs ARE REQUIRED. Vite builds with `base: './'`, so every other
      asset reference here is relative — but WhatsApp, iMessage, Slack and
      Facebook all refuse to resolve a relative og:image, and silently show no
      image at all. These two are the only hardcoded URLs in the app; change
      both if the site ever moves off GitHub Pages.

      THE PREVIEW IS THE SAME FOR EVERY LINK, and that is a routing
      consequence, not an oversight. The app uses HashRouter, so an invite is
      `…/#/join/CODE` and everything after the `#` is never sent to a server —
      a crawler fetching an invite link receives this exact file. Per-trip
      cards ("Tenzin invited you to Kyoto in Autumn") need path-based URLs and
      somewhere to render them per request; that is issue #247.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Wander" />
    <meta property="og:title" content="You're invited to plan a trip on Wander" />
    <meta property="og:description" content="Itinerary, budget, polls, packing and chat — everything the group needs in one place. No account needed to join." />
    <meta property="og:image" content="https://tseten1996.github.io/wander/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Wander — plan the trip together" />
    <meta property="og:url" content="https://tseten1996.github.io/wander/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="You're invited to plan a trip on Wander" />
    <meta name="twitter:description" content="Itinerary, budget, polls, packing and chat — everything the group needs in one place. No account needed to join." />
    <meta name="twitter:image" content="https://tseten1996.github.io/wander/og-image.png" />

    <script>
      // Apply saved theme before first paint to avoid a flash
      try {
        var t = localStorage.getItem('wander_theme')
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
