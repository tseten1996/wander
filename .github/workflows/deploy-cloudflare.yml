name: Deploy to Cloudflare Pages

# Second origin, running alongside GitHub Pages (#246) rather than replacing it.
# `deploy.yml` is deliberately untouched: while both run, GitHub Pages stays the
# canonical origin, every URL already in the wild keeps working, and abandoning
# either direction costs one deleted file.
#
# The build is duplicated from deploy.yml on purpose rather than shared. These
# two jobs must be able to diverge (different env, different publish step)
# without one silently changing the other's artifact, and a shared reusable
# workflow would couple the rollback path to the thing being rolled back.
#
# Requires two repo secrets, neither of which can be set from the repo:
#   CLOUDFLARE_API_TOKEN   — scoped to Pages:Edit on this project only
#   CLOUDFLARE_ACCOUNT_ID
# Until both exist every run no-ops (see the guard on the deploy step), so
# merging this cannot break main.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

env:
  # Defined once — the create step and the deploy step must agree, and a
  # mismatch fails as "Project not found" with no hint that the two differ.
  PROJECT_NAME: wander

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Same public values as deploy.yml — RLS is the security boundary, not the
      # key, so these are safe to bake into the bundle.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      # A PR from a fork cannot read secrets, and the secrets may not be set yet.
      # Skip rather than fail: a red X on every PR would train everyone to ignore
      # this workflow, which is worse than it being quietly absent.
      - name: Check credentials
        id: creds
        # Secrets reach the shell through env, never interpolated into the
        # script body: `${{ secrets.X }}` inline would place the value in the
        # command line itself, where a shell trace or an error echo can surface
        # it past GitHub's masking.
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare secrets not configured — skipping deploy. See issue #246."
          fi

      # Direct upload of the artifact CI already built, rather than Cloudflare's
      # own Git build. Keeps one build definition: what deploys is byte-for-byte
      # what `npm run build` produced here, under the same Node version the
      # invariant and bundle-budget checks ran against.
      # `pages deploy` does not create a missing project — it fails with
      # "Project not found [code: 8000007]", which reads like a credentials
      # problem and isn't. Creating it here rather than in the dashboard keeps
      # the whole origin reproducible from the repo: someone forking or
      # rebuilding this gets a working deploy from secrets alone.
      #
      # Idempotent by listing first rather than by swallowing the create's
      # error, so a genuine failure (bad token scope, account over its project
      # limit) still fails the run instead of being mistaken for "already there".
      - name: Ensure the Pages project exists
        if: steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if npx --yes wrangler@3 pages project list | grep -qw "$PROJECT_NAME"; then
            echo "::notice::Pages project '$PROJECT_NAME' already exists."
          else
            echo "::notice::Creating Pages project '$PROJECT_NAME'."
            npx --yes wrangler@3 pages project create "$PROJECT_NAME" \
              --production-branch=main
          fi

      - name: Publish
        id: publish
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --commit-dirty: the checkout is clean, but the build writes dist/,
          # which wrangler sees as an uncommitted change and warns about on
          # every run. The warning is noise here — CI always deploys a
          # freshly-built tree.
          command: >-
            pages deploy dist
            --project-name=${{ env.PROJECT_NAME }}
            --branch=${{ github.head_ref || github.ref_name }}
            --commit-dirty=true

      # Proof that /api/ai is routed and executing, not just uploaded.
      #
      # Worth having because the failure it catches is silent. `pages deploy`
      # prints "Uploading Functions bundle" whether or not the route works, and
      # a missing Function is not an error anywhere in the deploy log — it is a
      # 404 that only shows up later as a broken feature.
      #
      # POSTing `{}` with no Authorization header is deliberately the *worst*
      # possible request: the handler refuses it either way — 503 `disabled`
      # when AI_ENABLED is unset, 400 `forbidden` once it is set — and both
      # answers prove the same thing. So this check does not care whether AI is
      # switched on, and will not start failing the day it is.
      #
      # WAIT FOR THE ORIGIN FIRST. A brand-new deployment gets its own
      # `<hash>.<project>.pages.dev` hostname, and that hostname is not routable
      # the instant `pages deploy` returns — for a few seconds it answers
      # Cloudflare's own 404. The first version of this check probed
      # immediately, read that 404 as "the Function is missing", and failed a
      # deploy that was fine. So `/` is polled until the origin answers before
      # anything at all is concluded about `/api/ai`.
      - name: Smoke-test the Pages Function
        if: steps.creds.outputs.ready == 'true'
        env:
          URL: ${{ steps.publish.outputs.deployment-url }}
        run: |
          set -uo pipefail
          if [ -z "${URL:-}" ]; then
            echo "::notice::No deployment URL reported — skipping the Function smoke test."
            exit 0
          fi

          probe() { curl -sS --max-time 20 -o "$2" -w '%{http_code} %{content_type}' "${@:3}" "$1"; }

          # 1. Is the deployment routable at all?
          origin=""
          for attempt in 1 2 3 4 5 6; do
            origin=$(probe "$URL/" /tmp/root.txt || echo "000 unreachable")
            case "$origin" in 2*) break ;; esac
            echo "Origin not ready yet (attempt $attempt): $origin"
            sleep $((attempt * 5))
          done
          case "$origin" in
            2*) echo "Origin is live: $origin" ;;
            *)
              echo "::warning::$URL never answered on / (last: $origin), so the Function"
              echo "::warning::could not be tested. That is a deployment-propagation problem,"
              echo "::warning::not evidence about /api/ai — not failing the run on it."
              exit 0
              ;;
          esac

          # 2. Now the endpoint itself. The origin is up, so a non-JSON answer
          #    here is about the Function, not about the deployment.
          answer=""
          for attempt in 1 2 3; do
            answer=$(probe "$URL/api/ai" /tmp/ai-probe.txt \
              -X POST -H 'content-type: application/json' -d '{}' || echo "000 unreachable")
            case "$answer" in *application/json*) break ;; esac
            echo "No JSON yet (attempt $attempt): $answer"
            sleep $((attempt * 5))
          done

          echo "Response: $answer"
          echo "Body: $(head -c 400 /tmp/ai-probe.txt)"

          case "$answer" in
            *application/json*) ;;
            *)
              echo "::error::/api/ai did not answer with JSON, even though $URL/ is live."
              echo "::error::The Function is not routed. Check that functions/api/ai.ts still"
              echo "::error::exports onRequestPost, and that the deploy ran from the repo root"
              echo "::error::so wrangler could find functions/ — see AI-ARCHITECTURE.md 5.1.1."
              exit 1
              ;;
          esac

          # Whitespace-tolerant: the handler emits compact JSON today, but this
          # is asserting a *property* of the response, not its formatting.
          if ! grep -qE '"ok"[[:space:]]*:[[:space:]]*false' /tmp/ai-probe.txt; then
            echo "::error::/api/ai answered JSON but not a refusal. Expected the handler to"
            echo "::error::reject an empty, unauthenticated body — see src/server/ai/handler.ts."
            exit 1
          fi

          echo "::notice::/api/ai is routed and refusing correctly on this deployment."

          # 3. The same check against the STABLE alias, which is what people
          #    actually open.
          #
          #    These can disagree, and the disagreement is invisible from the
          #    deploy log. `pages deploy --branch=main` only produces a
          #    *production* deployment if `main` is the project's production
          #    branch; if it is not, every deploy lands as a preview, the
          #    per-deployment hostname is perfect, and the alias keeps serving
          #    whatever was last deployed to the real production branch —
          #    possibly a build from before /api/ai existed. Checking only the
          #    fresh hostname would report success while every user got a 404.
          #    Derive the alias by dropping the deployment-hash label, but only
          #    from a hostname that actually has one: `<hash>.<project>.pages.dev`
          #    is four labels, the alias is three. Blindly stripping the first
          #    label would turn the alias itself into `pages.dev` — a real
          #    domain belonging to someone else, which this must never probe.
          host=${URL#https://}
          host=${host%%/*}
          labels=$(echo "$host" | tr '.' '\n' | wc -l)
          case "$host" in
            *.pages.dev) ;;
            *) labels=0 ;;
          esac
          if [ "$labels" -lt 4 ]; then
            echo "::notice::$URL has no deployment-hash label — it is already the stable"
            echo "::notice::hostname, so there is no separate alias to check."
            exit 0
          fi
          alias_url="https://${host#*.}"
          echo "Stable alias: $alias_url"

          alias_answer=""
          for attempt in 1 2 3; do
            alias_answer=$(probe "$alias_url/api/ai" /tmp/alias-probe.txt \
              -X POST -H 'content-type: application/json' -d '{}' || echo "000 unreachable")
            case "$alias_answer" in *application/json*) break ;; esac
            echo "Alias has no JSON yet (attempt $attempt): $alias_answer"
            sleep $((attempt * 5))
          done

          echo "Alias response: $alias_answer"
          echo "Alias body: $(head -c 300 /tmp/alias-probe.txt)"

          case "$alias_answer" in
            *application/json*)
              echo "::notice::$alias_url/api/ai is routed too."
              ;;
            *)
              echo "::error::$alias_url/api/ai answered '$alias_answer', but the same"
              echo "::error::check passed on this deployment's own hostname. The alias is"
              echo "::error::serving a different (older) build — almost certainly because"
              echo "::error::this deploy was a PREVIEW, not production."
              echo "::error::Check the project's production branch:"
              echo "::error::  npx wrangler pages project list"
              echo "::error::  npx wrangler pages deployment list --project-name=$PROJECT_NAME"
              echo "::error::It must be 'main' for a push to main to update the alias."
              exit 1
              ;;
          esac
