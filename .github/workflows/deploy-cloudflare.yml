name: Deploy to Cloudflare Pages

# Second origin, running alongside GitHub Pages (#246) rather than replacing it.
# `deploy.yml` is deliberately untouched: while both run, GitHub Pages stays the
# canonical origin, every URL already in the wild keeps working, and abandoning
# either direction costs one deleted file.
#
# The build is duplicated from deploy.yml on purpose rather than shared. These
# two jobs must be able to diverge (different env, different publish step)
# without one silently changing the other's artifact, and a shared reusable
# workflow would couple the rollback path to the thing being rolled back.
#
# Requires two repo secrets, neither of which can be set from the repo:
#   CLOUDFLARE_API_TOKEN   — scoped to Pages:Edit on this project only
#   CLOUDFLARE_ACCOUNT_ID
# Until both exist every run no-ops (see the guard on the deploy step), so
# merging this cannot break main.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

env:
  # Defined once — the create step and the deploy step must agree, and a
  # mismatch fails as "Project not found" with no hint that the two differ.
  PROJECT_NAME: wander

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Same public values as deploy.yml — RLS is the security boundary, not the
      # key, so these are safe to bake into the bundle.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      # A PR from a fork cannot read secrets, and the secrets may not be set yet.
      # Skip rather than fail: a red X on every PR would train everyone to ignore
      # this workflow, which is worse than it being quietly absent.
      - name: Check credentials
        id: creds
        # Secrets reach the shell through env, never interpolated into the
        # script body: `${{ secrets.X }}` inline would place the value in the
        # command line itself, where a shell trace or an error echo can surface
        # it past GitHub's masking.
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare secrets not configured — skipping deploy. See issue #246."
          fi

      # Direct upload of the artifact CI already built, rather than Cloudflare's
      # own Git build. Keeps one build definition: what deploys is byte-for-byte
      # what `npm run build` produced here, under the same Node version the
      # invariant and bundle-budget checks ran against.
      # `pages deploy` does not create a missing project — it fails with
      # "Project not found [code: 8000007]", which reads like a credentials
      # problem and isn't. Creating it here rather than in the dashboard keeps
      # the whole origin reproducible from the repo: someone forking or
      # rebuilding this gets a working deploy from secrets alone.
      #
      # Idempotent by listing first rather than by swallowing the create's
      # error, so a genuine failure (bad token scope, account over its project
      # limit) still fails the run instead of being mistaken for "already there".
      - name: Ensure the Pages project exists
        if: steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if npx --yes wrangler@3 pages project list | grep -qw "$PROJECT_NAME"; then
            echo "::notice::Pages project '$PROJECT_NAME' already exists."
          else
            echo "::notice::Creating Pages project '$PROJECT_NAME'."
            npx --yes wrangler@3 pages project create "$PROJECT_NAME" \
              --production-branch=main
          fi

      - name: Publish
        id: publish
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --commit-dirty: the checkout is clean, but the build writes dist/,
          # which wrangler sees as an uncommitted change and warns about on
          # every run. The warning is noise here — CI always deploys a
          # freshly-built tree.
          command: >-
            pages deploy dist
            --project-name=${{ env.PROJECT_NAME }}
            --branch=${{ github.head_ref || github.ref_name }}
            --commit-dirty=true

      # Proof that /api/ai is routed and executing, not just uploaded.
      #
      # Worth having because the failure it catches is silent. `pages deploy`
      # prints "Uploading Functions bundle" whether or not the route works, and
      # if the Function is missing, Pages answers /api/ai with the SPA's
      # index.html — a 200 full of HTML that a browser turns into a JSON parse
      # error somewhere in a toast. The endpoint refusing loudly in JSON is a
      # much sharper signal than anything the deploy log can offer.
      #
      # POSTing `{}` with no Authorization header is deliberately the *worst*
      # possible request: the handler refuses it either way — 503 `disabled`
      # when AI_ENABLED is unset, 400 `forbidden` once it is set — and both
      # answers prove the same thing. So this check does not care whether AI is
      # switched on, and will not start failing the day it is.
      - name: Smoke-test the Pages Function
        if: steps.creds.outputs.ready == 'true'
        env:
          # NOTE: this output name could not be verified when written — the
          # sandbox that develops this repo cannot reach Cloudflare's docs. If
          # it is wrong the step skips with a notice rather than failing the
          # run, so a bad guess costs a missing check, never a false red.
          URL: ${{ steps.publish.outputs.deployment-url }}
        run: |
          set -uo pipefail
          if [ -z "${URL:-}" ]; then
            echo "::notice::No deployment URL reported — skipping the Function smoke test."
            exit 0
          fi

          # A fresh deployment takes a moment to become routable, so retry
          # rather than racing it. Three tries is enough to tell "propagating"
          # from "not there".
          for attempt in 1 2 3; do
            body=$(curl -sS --max-time 20 -o /tmp/ai-probe.txt -w '%{http_code} %{content_type}' \
              -X POST "$URL/api/ai" \
              -H 'content-type: application/json' \
              -d '{}') && break
            echo "::notice::Attempt $attempt could not reach $URL/api/ai; retrying."
            sleep $((attempt * 5))
          done

          echo "Response: $body"
          echo "Body: $(head -c 400 /tmp/ai-probe.txt)"

          case "$body" in
            *application/json*) ;;
            *)
              echo "::error::/api/ai did not answer with JSON. If this is HTML, the"
              echo "::error::Function is not routed and Pages served the SPA instead."
              exit 1
              ;;
          esac

          if ! grep -q '"ok":false' /tmp/ai-probe.txt; then
            echo "::error::/api/ai answered JSON but not a refusal. Expected the handler"
            echo "::error::to reject an empty, unauthenticated body — see src/server/ai/handler.ts."
            exit 1
          fi

          echo "::notice::/api/ai is routed and refusing correctly."
