# Cloudflare Pages configuration.
#
# Added for the Workers AI binding below, which cannot be expressed as a CLI
# flag. Keeping it in the repo rather than the dashboard means the binding is
# reviewable, and a rebuild from a fresh clone produces the same runtime.
#
# NO SECRETS BELONG IN THIS FILE — it is committed. Secrets go through
# `wrangler pages secret put`, which stores them write-only per environment.
# Putting one here would be the same mistake as a VITE_* variable, just with a
# different file extension.

name = "wander"
compatibility_date = "2026-08-18"
pages_build_output_dir = "dist"

# Workers AI. A platform-authenticated binding, not an API key: the function
# calls `env.AI` and Cloudflare handles auth, so there is no credential to
# store, scope or rotate. Unused until #212 wires up the first model call.
[ai]
binding = "AI"
